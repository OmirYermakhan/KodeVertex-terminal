[package]
name = "kodevertex-terminal"
version = "0.1.0"
description = "Терминал, удобный для чтения, с интеграцией Claude Code"
authors = ["KodeVertex"]
license = "MIT"
repository = "https://github.com/OmirYermakhan/KodeVertex-terminal"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
toml = "1.2.1"
dirs = "7.0.0"
fontdb = "0.24.0"
portable-pty = "0.9.0"
uuid = { version = "1.29.2", features = ["v4"] }
libc = "0.2.191"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.23.1"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

# Уменьшение картинок вложений в отладочной сборке и тестах иначе идёт десятки секунд.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
